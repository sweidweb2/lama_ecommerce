features:
  - name: User Login
    description: Login with email and password credentials using Supabase Auth
    files:
      - app/(public)/auth/login/page.tsx
      - components/auth/LoginForm.tsx
      - services/auth.service.ts
    entry_route: /auth/login
    user_interactions:
      - Fill email input field
      - Fill password input field
      - Toggle password visibility
      - Click Login button to submit
      - See error message on invalid credentials
      - See success toast on successful login
      - Redirect to home or admin panel based on role
    api_calls:
      - method: POST
        endpoint: Supabase Auth API (signInWithPassword)
      - method: GET
        endpoint: /api/auth/profile
    auth_required: false
  - name: User Signup
    description: Register new user account with email and password
    files:
      - app/(public)/auth/signup/page.tsx
      - components/auth/SignupForm.tsx
      - services/auth.service.ts
    entry_route: /auth/signup
    user_interactions:
      - Fill name input field
      - Fill email input field
      - Fill password input field
      - Confirm password field
      - See password strength indicator
      - Click Sign up button to submit
      - See error message on validation failure
      - See success message on successful signup
    api_calls:
      - method: POST
        endpoint: Supabase Auth API (signUp)
    auth_required: false
  - name: Product Browsing
    description: Browse and filter products by category, price, color, size
    files:
      - app/(public)/products/page.tsx
      - components/(public)/products/CategoryFiltering.tsx
      - components/(public)/products/AdvancedFilters.tsx
      - components/(public)/products/SizeFilter.tsx
      - components/(public)/products/ClientProductFilter.tsx
      - services/product.service.ts
      - services/categories.service.ts
    entry_route: /products
    user_interactions:
      - View product grid/list
      - Select category filter
      - Select color filter
      - Select size filter
      - Adjust price range slider
      - Sort products by price, name, date
      - Search products
      - Click on product to view details
      - Navigate pagination
    api_calls:
      - method: GET
        endpoint: Supabase Database (products table)
      - method: GET
        endpoint: Supabase Database (categories table)
    auth_required: false
  - name: Product Details
    description: View detailed product information with variants, images, reviews
    files:
      - app/(public)/products/[slug]/page.tsx
      - components/(public)/products/product_details/ProductMediaGallery.tsx
      - components/(public)/products/product_details/ProductCoreInfo.tsx
      - components/(public)/products/product_details/ProductCustomization.tsx
      - components/(public)/products/product_details/ProductReviews.tsx
      - repositories/product.repository.ts
      - services/product_variant.service.ts
      - services/review.service.ts
    entry_route: /products/[slug]
    user_interactions:
      - View product images gallery
      - Select product variant (color, size, material)
      - View product price and availability
      - Add product to cart
      - Add product to wishlist
      - View product reviews
      - Submit product review
      - Ask product question
      - View related products
      - Navigate breadcrumbs
    api_calls:
      - method: GET
        endpoint: Supabase Database (products table)
      - method: GET
        endpoint: Supabase Database (product_variants table)
      - method: GET
        endpoint: Supabase Database (reviews table)
      - method: POST
        endpoint: Server Action (trackProductViewAction)
    auth_required: false
  - name: Shopping Cart
    description: Manage shopping cart items for authenticated users and guests
    files:
      - app/(public)/cart/page.tsx
      - components/(public)/cart/CartItem.tsx
      - components/(public)/cart/CartSidebar.tsx
      - services/cart.service.ts
      - actions/cart.ts
    entry_route: /cart
    user_interactions:
      - View cart items
      - Update item quantity
      - Remove item from cart
      - View cart subtotal
      - Select shipping zone
      - Proceed to checkout
      - Continue shopping
    api_calls:
      - method: GET
        endpoint: Supabase Database (carts table)
      - method: GET
        endpoint: Supabase Database (cart_items table)
      - method: POST
        endpoint: Server Action (updateCartItemAction)
      - method: POST
        endpoint: Server Action (removeCartItemAction)
      - method: GET
        endpoint: Supabase Database (shipping_zones table)
    auth_required: false
  - name: Wishlist
    description: Save favorite products to wishlist
    files:
      - app/(public)/wishlist/page.tsx
      - app/(useraccount)/account/wishlist/page.tsx
      - services/wishlist.service.ts
      - actions/wishlist.ts
    entry_route: /wishlist
    user_interactions:
      - View wishlist items
      - Add product to wishlist
      - Remove product from wishlist
      - Navigate to product from wishlist
      - Add wishlist item to cart
    api_calls:
      - method: GET
        endpoint: Supabase Database (wishlists table)
      - method: POST
        endpoint: Server Action (addToWishlistAction)
      - method: POST
        endpoint: Server Action (removeFromWishlistAction)
    auth_required: false
  - name: User Profile
    description: View and edit user profile information
    files:
      - app/(public)/profile/page.tsx
      - app/(public)/profile/setting/page.tsx
      - components/account/ProfileForm.tsx
      - actions/profile.ts
      - services/profile.service.ts
    entry_route: /profile
    user_interactions:
      - View profile information
      - Edit profile name
      - Edit profile email
      - Update profile settings
      - View order history
      - Manage addresses
    api_calls:
      - method: GET
        endpoint: /api/auth/profile
      - method: GET
        endpoint: Supabase Database (profiles table)
      - method: POST
        endpoint: Server Action (updateProfileAction)
    auth_required: true
  - name: Order Management
    description: View order history and order details
    files:
      - app/(public)/orders/page.tsx
      - app/(public)/order_details/[id]/page.tsx
      - services/order.service.ts
      - repositories/order.repository.ts
    entry_route: /orders
    user_interactions:
      - View orders list
      - Filter orders by status
      - View order details
      - Track order status
      - View order items
      - View order shipping information
    api_calls:
      - method: GET
        endpoint: Supabase Database (orders table)
      - method: GET
        endpoint: Supabase Database (order_items table)
    auth_required: true
  - name: Admin Dashboard
    description: Admin panel dashboard with statistics and overview
    files:
      - app/admin/page.tsx
      - components/admin/stat-card.tsx
      - services/dashboard.service.ts
    entry_route: /admin
    user_interactions:
      - View dashboard statistics
      - View recent orders
      - View recent users
      - Navigate to admin sections
      - View analytics charts
    api_calls:
      - method: GET
        endpoint: Supabase Database (dashboard stats queries)
    auth_required: true
  - name: Admin Product Management
    description: Create, edit, and manage products in admin panel
    files:
      - app/admin/products/page.tsx
      - app/admin/products/create/page.tsx
      - app/admin/products/[id]/page.tsx
      - components/admin/products/ProductForm.tsx
      - actions/product.ts
      - services/product.service.ts
    entry_route: /admin/products
    user_interactions:
      - View products list
      - Create new product
      - Edit existing product
      - Upload product images
      - Add product variants
      - Set product pricing
      - Manage product categories and brands
      - Activate/deactivate products
      - Delete products
    api_calls:
      - method: GET
        endpoint: Supabase Database (products table)
      - method: POST
        endpoint: Server Action (createProductAction)
      - method: POST
        endpoint: Server Action (updateProductAction)
      - method: POST
        endpoint: Server Action (deleteProductAction)
      - method: POST
        endpoint: Supabase Storage (product images)
    auth_required: true
  - name: Admin Order Management
    description: View and manage customer orders
    files:
      - app/admin/orders/page.tsx
      - app/admin/orders/[id]/page.tsx
      - components/admin/orders/OrdersList.tsx
      - services/order.service.ts
    entry_route: /admin/orders
    user_interactions:
      - View orders list
      - Filter orders by status
      - View order details
      - Update order status
      - View order payment information
      - View customer information
      - Process refunds
    api_calls:
      - method: GET
        endpoint: Supabase Database (orders table)
      - method: GET
        endpoint: Supabase Database (order_items table)
      - method: POST
        endpoint: Server Action (updateOrderStatusAction)
    auth_required: true
known_limitations: []
