version: "2"
type: frontend
tech_stack:
  - TypeScript
  - Next.js 16
  - React 19
  - Tailwind CSS
  - Supabase
  - Radix UI
  - React Hook Form
  - Zod
  - TanStack Query
routes:
  - path: /
    file: app/page.tsx
    auth_required: false
    description: Home page with hero, featured products, categories, and promotional banners
  - path: /auth/login
    file: app/(public)/auth/login/page.tsx
    auth_required: false
    description: User login page with email and password
  - path: /auth/signup
    file: app/(public)/auth/signup/page.tsx
    auth_required: false
    description: User registration page
  - path: /auth/callback
    file: app/(public)/auth/callback/route.ts
    auth_required: false
    description: OAuth callback handler for authentication
  - path: /products
    file: app/(public)/products/page.tsx
    auth_required: false
    description: Products listing page with filters and sorting
  - path: /products/[slug]
    file: app/(public)/products/[slug]/page.tsx
    auth_required: false
    description: Product detail page with variants, reviews, and add to cart
  - path: /cart
    file: app/(public)/cart/page.tsx
    auth_required: false
    description: Shopping cart page for authenticated users and guests
  - path: /wishlist
    file: app/(public)/wishlist/page.tsx
    auth_required: false
    description: Wishlist page for saving favorite products
  - path: /profile
    file: app/(public)/profile/page.tsx
    auth_required: true
    description: User profile page
  - path: /profile/setting
    file: app/(public)/profile/setting/page.tsx
    auth_required: true
    description: User profile settings page
  - path: /orders
    file: app/(public)/orders/page.tsx
    auth_required: true
    description: User orders list page
  - path: /order_details/[id]
    file: app/(public)/order_details/[id]/page.tsx
    auth_required: true
    description: Order details page
  - path: /account
    file: app/(useraccount)/account/page.tsx
    auth_required: true
    description: Account dashboard page
  - path: /account/wishlist
    file: app/(useraccount)/account/wishlist/page.tsx
    auth_required: true
    description: Account wishlist page
  - path: /about-us
    file: app/(public)/about-us/page.tsx
    auth_required: false
    description: About us page
  - path: /contact-us
    file: app/(public)/contact-us/page.tsx
    auth_required: false
    description: Contact us page
  - path: /privacy_policy
    file: app/(public)/privacy_policy/page.tsx
    auth_required: false
    description: Privacy policy page
  - path: /terms
    file: app/(public)/terms/page.tsx
    auth_required: false
    description: Terms of service page
  - path: /shipping-terms
    file: app/(public)/shipping-terms/page.tsx
    auth_required: false
    description: Shipping terms page
  - path: /admin
    file: app/admin/page.tsx
    auth_required: true
    description: Admin dashboard with statistics and overview
  - path: /admin/products
    file: app/admin/products/page.tsx
    auth_required: true
    description: Admin products management page
  - path: /admin/products/create
    file: app/admin/products/create/page.tsx
    auth_required: true
    description: Admin create product page
  - path: /admin/products/[id]
    file: app/admin/products/[id]/page.tsx
    auth_required: true
    description: Admin edit product page
  - path: /admin/products/grid
    file: app/admin/products/grid/page.tsx
    auth_required: true
    description: Admin products grid view
  - path: /admin/categories
    file: app/admin/categories/page.tsx
    auth_required: true
    description: Admin categories management page
  - path: /admin/brands
    file: app/admin/brands/page.tsx
    auth_required: true
    description: Admin brands management page
  - path: /admin/orders
    file: app/admin/orders/page.tsx
    auth_required: true
    description: Admin orders list page
  - path: /admin/orders/[id]
    file: app/admin/orders/[id]/page.tsx
    auth_required: true
    description: Admin order details page
  - path: /admin/users
    file: app/admin/users/page.tsx
    auth_required: true
    description: Admin users management page
  - path: /admin/carts
    file: app/admin/carts/page.tsx
    auth_required: true
    description: Admin carts management page
  - path: /admin/analytics
    file: app/admin/analytics/page.tsx
    auth_required: true
    description: Admin analytics dashboard
  - path: /admin/reviews
    file: app/admin/reviews/page.tsx
    auth_required: true
    description: Admin reviews management page
  - path: /admin/qa
    file: app/admin/qa/page.tsx
    auth_required: true
    description: Admin Q&A management page
  - path: /admin/contact
    file: app/admin/contact/page.tsx
    auth_required: true
    description: Admin contact messages page
  - path: /admin/leads
    file: app/admin/leads/page.tsx
    auth_required: true
